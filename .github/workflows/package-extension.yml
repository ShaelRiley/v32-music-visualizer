name: Package verified extension

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-extension.yml'
      - 'src/**'
      - 'assets/**'
      - 'manifest.json'
      - 'visualizer.html'
      - 'offscreen.html'
      - 'space-credits.html'
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
      - 'tools/build.mjs'
      - 'tools/package.mjs'
      - 'tools/zip-qa.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-extension-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Confirm the committed runtime matches source
        run: |
          npm run build
          test -z "$(git status --porcelain -- dist/extension)"
      - name: Generate and verify the archive
        run: |
          npm run package
          python3 tools/zip-qa.py --check-recorded-hash
      - name: Commit the verified ZIP
        run: |
          git add dist/Video32-Chrome-Extension.zip
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          video32_package_version=$(node -p 'JSON.parse(require("fs").readFileSync("manifest.json","utf8")).version')
          git commit -m "Package Video32 $video32_package_version verified extension"
          git push origin HEAD:main
